# Routine npm version bumps are turned off here (open-pull-requests-limit: 0).
# Dependabot still opens pull requests for known security vulnerabilities via
# Dependabot security updates. That requires the repo setting:
# Settings > Code security > Dependabot security updates (must be enabled).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
